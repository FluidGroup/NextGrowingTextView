name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build GrowingTextViewDemo
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26.6"

      - name: Build SwiftUI product
        run: swift build --target NextGrowingTextViewSwiftUI

      - name: Build
        run: |
          xcodebuild build \
            -project NextGrowingTextView.xcodeproj \
            -scheme GrowingTextViewDemo \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
